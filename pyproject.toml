[project]
name = "napari-remak-bundle-assistant"
version = "1.0.1"
description = "Research-grade Remak bundle to peripheral nerve boundary morphometry for napari"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Wulin Teo"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "napari>=0.4.19",
    "numpy",
    "qtpy",
    "scikit-image",
    "scipy",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
all = ["napari[all]>=0.4.19"]
test = ["pytest", "pytest-qt", "napari[qt]>=0.4.19"]

[project.entry-points."napari.manifest"]
napari-remak-bundle-assistant = "napari_remak_bundle_assistant:napari.yaml"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_remak_bundle_assistant = ["napari.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
